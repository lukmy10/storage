apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-to-pvc-synchronizer
  namespace: argocd # Upewnij się, że to ten sam namespace, w którym jest PVC
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-synchronizer
  template:
    metadata:
      labels:
        app: git-synchronizer
    spec:
      # KROK 1: Nadpisujemy właściciela wolumenu na poziomie całego Poda.
      # Kubernetes automatycznie wykona odpowiednik 'chown' na nowym PVC dla grupy 65533
      securityContext:
        fsGroup: 65533 
        runAsGroup: 65533
        runAsUser: 65533  
    
      containers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.2.3
        args:
        # 1. Konfiguracja Twojego repozytorium Git z plikami
        - --repo=https://github.com/lukmy10/storage/files
        - --ref=main
        
        # 2. Gdzie w kontenerze zamontowane jest PVC
        - --root=/git-data/
        
        
        # 3. Nazwa podfolderu na PVC, do którego trafią pliki (np. /tmp/git-data/pliki)
        - --dest=files          
        
        # 4. Jak czesto (w sekundach) sprawdzać Git i dociągać nowe pliki
        - --wait=60                    
        
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: target-pvc-volume
          mountPath: /git-data # Ścieżka montowania PVC w tym kontenerze
          
      volumes:
      - name: target-pvc-volume
        persistentVolumeClaim:
          # 5. Wpisz dokładnie nazwę swojego ISTNIEJĄCEGO dysku PVC
          claimName: rbd-pvc-nginx-argocd
